<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Proyectos</title>


    <!-- CSS GENERAL -->
    <link
        rel="stylesheet"
        href="../styles.css"
    >


    <!-- CSS PROYECTOS -->
    <link
        rel="stylesheet"
        href="proyectos.css"
    >


    <!-- JS GENERAL -->
    <script
        src="../app.js"
        defer
    ></script>


    <!-- JS PROYECTOS -->
    <script
        src="proyectos.js"
        defer
    ></script>

</head>


<body class="proyectos-page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="main-header">

        <div class="container">


            <!-- LOGO -->

            <a
                href="../index.html"
                class="logo-link"
                aria-label="Ir al inicio"
            >

                <div class="logo">

                    <img
                        src="../imagenes/Logo.jpeg"
                        alt="Logo Grupo CIC PERÚ"
                    >

                    <span>
                        Grupo CIC PERÚ
                    </span>

                </div>

            </a>


            <!-- MENÚ RESPONSIVE -->

            <button
                type="button"
                class="menu-toggle"
                id="menuToggle"
                aria-label="Abrir menú"
                aria-controls="mainNav"
                aria-expanded="false"
            >

                <span></span>
                <span></span>
                <span></span>

            </button>


            <!-- =================================================
                 NAVEGACIÓN
            ================================================== -->

            <nav
                class="main-nav"
                id="mainNav"
                aria-label="Navegación principal"
            >

                <ul>


                    <!-- INICIO -->

                    <li>

                        <a href="../index.html">
                            Inicio
                        </a>

                    </li>


                    <!-- CORPORACIÓN -->

                    <li>

                        <a href="../corporacion/corporacion.html">
                            Corporación
                        </a>

                    </li>


                    <!-- SERVICIOS -->

                    <li>

                        <a href="../servicios/servicios.html">
                            Servicios
                        </a>

                    </li>


                    <!-- BIENES -->

                    <li>

                        <a href="../bienes/bienes.html">
                            Bienes
                        </a>

                    </li>


                    <!-- PROYECTOS -->

                    <li>

                        <a
                            href="../proyectos/proyectos.html"
                            class="active"
                            aria-current="page"
                        >
                            Proyectos
                        </a>

                    </li>


                    <!-- LICITACIONES -->

                    <li>

                        <a href="../licitaciones/licitaciones.html">
                            Licitaciones
                        </a>

                    </li>


                    <!-- CONTACTO -->

                    <li>

                        <a href="../contacto/contacto.html">
                            Contacto
                        </a>

                    </li>


                </ul>

            </nav>


        </div>

    </header>



    <!-- =====================================================
         PROYECTOS
    ====================================================== -->

    <main>

        <section class="grid">


            <!-- PROYECTO ENERGÉTICO RURAL -->

            <div
                class="card energetico"
                tabindex="0"
            >
                Proyecto Energético Rural
            </div>


            <!-- SISTEMA DE SEGURIDAD URBANA -->

            <div
                class="card seguridad"
                tabindex="0"
            >
                Sistema de Seguridad Urbana
            </div>


            <!-- IMPLEMENTACIÓN LOGÍSTICA -->

            <div
                class="card logistica"
                tabindex="0"
            >
                Implementación Logística
            </div>


        </section>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        <p>
            © 2026 Grupo CIC PERÚ
        </p>

    </footer>



    <!-- =====================================================
         WHATSAPP
    ====================================================== -->

    <a
        href="https://wa.me/51945340444"
        class="whatsapp"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="WhatsApp"
    >

        <img
            src="../imagenes/whatsapp.png"
            alt="WhatsApp"
        >

    </a>


</body>

</html>
